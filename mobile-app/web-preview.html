<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SurakshaVikas AR — Mobile Demo</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0B1F3A;display:flex;justify-content:center} .phone{width:100%;max-width:430px;min-height:100vh;background:#F4F6FA;display:flex;flex-direction:column} header{background:#0B1F3A;color:#fff;padding:14px;display:flex;justify-content:space-between} .body{padding:18px;flex:1} h1{color:#0B1F3A} .btn{display:block;width:100%;padding:18px;margin:8px 0;border:none;border-radius:14px;background:#F5820B;color:#fff;font-size:18px;font-weight:900;cursor:pointer} .btn.g{background:#0E7C3E}.btn.n{background:#0B1F3A}.card{background:#fff;border-radius:12px;padding:14px;margin:8px 0}.mod{display:flex;gap:12px;background:#fff;border-radius:12px;padding:14px;margin:8px 0;cursor:pointer;align-items:center}.ar{background:#111;color:#0f0;border-radius:12px;padding:12px;text-align:center}.marker{display:inline-block;background:#fff;color:#111;border:3px solid #FFC107;border-radius:14px;padding:14px;margin:8px;font-size:15px;font-weight:800;cursor:pointer;animation:float 1.8s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}} .opt{background:#fff;padding:16px;border-radius:10px;margin:6px 0;cursor:pointer;font-size:17px}.bar{height:14px;background:#ddd;border-radius:7px}.bar>div{height:14px;background:#0E7C3E;border-radius:7px} .discl{background:#FFF3CD;font-size:11px;padding:8px;text-align:center} input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #ccc;font-size:17px;margin:4px 0} .cert{background:#FFFEF5;border:4px solid #F5820B;border-radius:14px;padding:20px;text-align:center}</style></head><body>
<div class="phone"><header><b>⛑️ SurakshaVikas AR</b><span id="net">📶</span></header><div class="body" id="app"></div><div class="discl">⚠️ SIMULATION — Training Only. Follow approved workplace SOPs in real emergencies.</div></div>
<script>
const T={en:{welcome:'Welcome',tagline:'Learn Safety. Practice Safely. Work Confidently.'},hi:{welcome:'स्वागत है',tagline:'सुरक्षा सीखें। सुरक्षित अभ्यास करें। आत्मविश्वास से काम करें।'}};
let lang='hi',worker=null,certs=JSON.parse(localStorage.getItem('svc')||'[]'),results=JSON.parse(localStorage.getItem('svr')||'[]');
const $=h=>app.innerHTML=h;
function splash(){$('<h1 style=text-align:center;font-size:60px>⛑️</h1><h1 style=text-align:center>SurakshaVikas AR</h1><p style=text-align:center>'+T[lang].tagline+'</p>');setTimeout(onboard,1000);}
function onboard(){$('<h1>🦺 '+(lang==='hi'?'स्वागत है':'Welcome')+'</h1><p>'+T[lang].tagline+'</p><button class=btn onclick="setLang()">🌐 Language / भाषा चुनें</button><button class="btn g" onclick="fireIntro(true)">🎯 DEMO MODE — Fire AR</button><button class=btn onclick="register()">📝 Register</button>');}
function setLang(){$('<h1>Select Language / भाषा चुनें</h1>'+['hi|हिन्दी','en|English','sat|Santali / ᱥᱟᱱᱛᱟᱲᱤ'].map(x=>{const[c,l]=x.split('|');return `<div class=mod onclick="lang='${c}';onboard()"><b>${l}</b>${lang===c?' ✅':''}</div>`}).join(''));}
function register(){$('<h1>📝 Register</h1><input id=n placeholder="Full Name / नाम"><input id=w placeholder="Worker ID: JH-2026-001"><select id=s><option>Mining</option><option>Steel</option><option>Mica</option><option>Other</option></select><button class=btn onclick="worker={name:n.value||`Demo Worker`,workerId:w.value||`DEMO-001`,sector:s.value};dashboard()">Register →</button>');}
function dashboard(){const done=results.filter(r=>r.passed).length;$('<h1>🙏 Namaste, '+(worker?.name||'Worker')+'</h1><div class=card><b>Safety Training — '+Math.round(done/5*100)+'%</b><div class=bar><div style="width:'+Math.round(done/5*100)+'%"></div></div></div>'
+[['🔥','Fire & Explosion Response','fireIntro()',1],['☠️','Gas Leak & Confined Space','gasIntro()',1],['⚙️','Machinery Safety','',0],['🦺','PPE & Workplace Safety','',0],['⛑️','Emergency Response','',0]].map(m=>`<div class=mod onclick="${m[3]?m[2]:`alert('🔜 Coming Soon')`}"><span style=font-size:34px>${m[0]}</span><div><b>${m[1]}</b><br>${m[3]?'▶️ Start Training':'🔒 Coming Soon'}</div></div>`).join('')
+`<button class=btn onclick="history()">📜 History</button><button class="btn g" onclick="verifyUI()">✅ Verify Certificate</button>`);}
function fireIntro(){$('<div class=card style="background:#D92D20;color:#fff">🔥 FIRE EMERGENCY — Fire detected in the workplace.</div><div class=card>1. Identify fire hazard<br>2. Select extinguisher<br>3. Safest exit<br>4. Evacuation sequence<br>5. Assembly point</div><button class=btn onclick="fireAR(0)">📷 START AR TRAINING</button><p>📡 Offline Mode — training works offline.</p>');}
function fireAR(s){
if(s===0)$('<div class=ar>📷 CAMERA VIEW • 🔴 REC<br><br><div class=marker onclick="fireAR(1)">🔥<br>FIRE ⚠️</div><br><div class=marker onclick="alert(`❌ Incorrect. Look for the source of fire.`)">🪑 Chair</div><div class=marker onclick="alert(`❌ Incorrect`)">💧 Water</div><p style=color:#fff>Tap the fire hazard</p></div>');
if(s===1)$('<div class=ar>📷 CAMERA VIEW<br><p style=color:#fff>Select correct extinguisher</p><div class=marker onclick="fireAR(2)">🧯<br>ABC Powder ✔</div><div class=marker onclick="alert(`❌ Incorrect action`)">🪣 Water bucket</div></div>');
if(s===2)$('<div class=ar>📷 CAMERA VIEW<br><p style=color:#fff>Choose safest exit</p><div class=marker onclick="alert(`⚠️ Unsafe Route`)">🚪 EXIT A 🔥</div><div class=marker onclick="fireSeq()">🚪 EXIT B ➡️ SAFE</div><br><span style=font-size:28px>➡️ 📍 Assembly Point</span></div>');}
function fireSeq(){const c=['Raise alarm','Identify hazard','Alert others','Select safe exit','Evacuate','Reach assembly point'];let o=[...c].sort(()=>Math.random()-.5);const r=()=>{$('<h1>Evacuation Sequence</h1><p>Tap an item to move it up</p>'+o.map((x,i)=>`<div class=opt onclick="window._m(${i})">${i+1}. ${x} ⬆️</div>`).join('')+`<button class=btn onclick="window._c()">Check</button>`);window._m=i=>{if(i>0){[o[i-1],o[i]]=[o[i],o[i-1]];r();}};window._c=()=>{JSON.stringify(o)===JSON.stringify(c)?($('<h1>✅ Evacuation completed!</h1><button class="btn g" onclick="quiz(`fire`)">Start Assessment →</button>')):alert('❌ Order wrong — Alarm first, Assembly last.');};};r();}
function gasIntro(){$('<div class=card>☠️ Gas suspected in confined area. Identify hazard zone, PPE, buddy procedure.</div><button class=btn onclick="gasAR(0)">📷 START AR TRAINING</button>');}
function gasAR(s){
if(s===0)$('<div class=ar>📷 CAMERA VIEW<br><div class=marker onclick="alert(`❌ Safe area`)">🟢 SAFE</div><div class=marker onclick="alert(`⚠️ Caution`)">🟡 CAUTION</div><div class=marker onclick="gasAR(1)">🔴 GAS ☠️</div><p style=color:#fff>Tap the red hazard zone</p></div>');
if(s===1)$('<div class=ar>📷 CAMERA VIEW<br><p style=color:#fff>Select PPE</p><div class=marker onclick="gasAR(2)">😷 Respiratory ✔</div><div class=marker onclick="alert(`❌ Incorrect`)">🕶️ Sunglasses</div><div class=marker onclick="alert(`❌ Incorrect`)">🩴 Sandals</div></div>');
if(s===2)$('<h1>Should a worker enter a confined space alone?</h1><div class=opt onclick="alert(`❌ Wrong — never alone`)">A. Yes</div><div class=opt onclick="gasAR(3)">B. No</div>');
if(s===3)$('<h1>Identify UNSAFE action</h1>'+['Checking per procedure ✔','Using PPE ✔','Entering alone ✖','Communication ✔'].map(x=>`<div class=opt onclick="${x.includes('alone')?`quiz('gas')`:`alert('❌ That is safe')`}">👷 ${x}</div>`).join(''));}
const Q={fire:[['First action on fire?',['Raise alarm','Run','Hide','Nothing'],0],['Extinguisher for electrical fire?',['Water','ABC Powder / CO₂','Sand only','Cloth'],1],['Exit near fire is…',['Safe','Unsafe — alternate exit','Fastest','Use lift'],1],['After alarm…',['Alert others & exit','Collect items','Use lift','Re-enter'],0],['Assembly point is for…',['Headcount','Tea','Parking','Storage'],0],['Clothes on fire?',['Stop-Drop-Roll','Run','Petrol','Fan'],0],['Correct order?',['Alarm→Alert→Exit→Assembly','Exit→Alarm','Assembly→Alarm','Alert→Assembly→Alarm'],0],['Smoke corridor?',['Stay low, follow arrows','Stand tall','Open doors','Wait'],0],['Inform whom?',['Marshal/supervisor','No one','Friends','Media'],0],['Simulators are…',['Practice only, follow SOPs','Real fire','Test fire','Fun'],0]],
gas:[['Red zone means…',['Do not enter','Picnic','Storage','Rest'],0],['PPE for gas leak?',['Respiratory protection','Sunglasses','Sandals','None'],0],['Enter alone?',['Yes','No'],1],['Unsafe action?',['Entering alone','Checking per SOP','Wearing PPE','Attendant outside'],0],['First response?',['Alert & evacuate','Light match','Ignore','Enter alone'],0],['Buddy system?',['Attendant+comms','Two inside only','Nobody outside','Phone off'],0]]};
let qi=0,ans=[];
function quiz(m){qi=0;ans=[];q(m);}
function q(m){const qs=Q[m];if(qi>=qs.length){const ok=ans.filter((a,i)=>a===qs[i][2]).length;const pct=Math.round(ok/qs.length*100);const pass=pct>=70;results.push({m,pct,passed:pass,at:new Date().toISOString()});localStorage.setItem('svr',JSON.stringify(results));
if(pass){const id='SVAR-'+Math.floor(100000+Math.random()*900000);const c={id,worker:worker?.name||'Demo Worker',wid:worker?.workerId||'DEMO-001',m:m==='fire'?'Fire & Explosion Response':'Gas Leak & Confined Space',score:pct,at:new Date().toDateString()};certs.push(c);localStorage.setItem('svc',JSON.stringify(certs));cert(c);}else $(`<h1 style=color:#D92D20>🔁 RETRY REQUIRED</h1><h1>Score: ${pct}%</h1><p>You did not reach 70%. Review and try again.</p><button class=btn onclick="quiz('${m}')">🔁 Retry Assessment</button><button class="btn n" onclick="dashboard()">Dashboard</button>`);return;}
const[qq,opts]=qs[qi];$(`<p>Q${qi+1}/${qs.length}</p><h1>${qq}</h1>`+opts.map((o,k)=>`<div class=opt onclick="ans.push(${k});qi++;q('${m}')">${String.fromCharCode(65+k)}. ${o}</div>`).join(''));}
function cert(c){$('<div class=cert><h2>SURAKSHAVIKAS AR</h2><p>Certificate of Safety Training</p><h2>'+c.worker+'</h2><p>'+c.m+'<br>Score: '+c.score+'% • '+c.wid+'<br>'+c.at+' • '+c.id+'<br>✅ VERIFIED</p><div id=qr></div></div><button class="btn g" onclick="verifyUI(`'+c.id+'`)">✅ Verify QR</button><button class="btn n" onclick="dashboard()">Dashboard</button>');QRCode.toCanvas(c.id,(e,cv)=>{if(!e)qr.appendChild(cv);});}
function history(){$('<h1>📜 History</h1>'+results.map(r=>`<div class=card>${r.m} — ${r.pct}% ${r.passed?'✅':'❌'}</div>`).join('')+certs.map(c=>`<div class=card>📜 ${c.id} — ${c.m}</div>`).join('')+`<button class="btn n" onclick="dashboard()">← Back</button>`);}
function verifyUI(pre){$(' <h1>Certificate Verification</h1><input id=vid placeholder="SVAR-123456" value="'+(pre||'')+'"><button class=btn onclick="doV()">Verify</button><div id=vo></div><button class="btn n" onclick="dashboard()">← Back</button>');if(pre)doV();}
async function doV(){const id=vid.value.trim();const loc=certs.find(c=>c.id===id);if(loc){vo.innerHTML=`<div class=card><h2 style=color:green>✅ VALID CERTIFICATE</h2>Worker: ${loc.worker}<br>Training: ${loc.m}<br>Score: ${loc.score}%<br>ID: ${loc.id}</div>`;return;}try{const r=await fetch('/api/certificates/'+id);if(r.ok){const c=await r.json();vo.innerHTML=`<div class=card><h2 style=color:green>✅ VALID CERTIFICATE</h2>Worker: ${c.workerName}<br>Training: ${c.moduleName}<br>Score: ${c.score}%</div>`;}else vo.innerHTML='<div class=card><h2 style=color:red>❌ CERTIFICATE NOT FOUND</h2></div>';}catch{vo.innerHTML='<div class=card><h2 style=color:red>❌ NOT FOUND (offline)</h2></div>';}}
splash();
</script></body></html>
